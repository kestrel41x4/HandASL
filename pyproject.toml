[project]
name = "handasl"
version = "0.1.0"
description = "ASL hand sign detection with YOLO, trained on a Roboflow dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3.0",
    "roboflow>=1.1.0",
    "opencv-python>=4.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Pick one: `uv sync --extra cpu` or `uv sync --extra cu128` (NVIDIA GPU)
cpu = ["torch>=2.5", "torchvision>=0.20"]
cu128 = ["torch>=2.5", "torchvision>=0.20"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
